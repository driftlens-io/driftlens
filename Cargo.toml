[workspace]
members = [
    "crates/core",
    "crates/model-reader",
    "crates/db-probe",
    "crates/reporter",
    "cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DriftLens Contributors"]
license = "AGPL-3.0"
repository = "https://github.com/driftlens-io/driftlens"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }

# CLI
clap = { version = "4", features = ["derive"] }

async-trait = "0.1"

regex = "1"
walkdir = "2"